{% assign entry = include.entry %}{% if entry.quote and entry.quote != '' %}
<blockquote class="quote">{{ entry.quote | escape }}{% for reference in entry.references %}{% if reference.id == entry.quote_reference %} <sup class="citation"><a target="_blank" rel="noopener noreferrer" href="#ref-{{ entry.reference_key | escape }}-{{ forloop.index }}" aria-label="Reference {{ forloop.index }}" title="{{ entry.quote_locator | escape }}">[{{ forloop.index }}]</a></sup>{% endif %}{% endfor %}</blockquote>
{% endif %}
