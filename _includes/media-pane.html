{% assign evidence = site.data.evidence[include.entry.url] %}
<aside class="post-media" aria-label="Media for {{ include.entry.title | escape }}"{% unless evidence.pdf %} hidden{% endunless %}>
{% if evidence.pdf %}
<div class="evidence-pdf" data-media-key="pdf:{{ evidence.pdf | escape }}" data-static-media>
{% if evidence.previews %}
{% for preview in evidence.previews %}
<figure><a href="{{ evidence.pdf | relative_url | escape }}" aria-label="Open original poster PDF"><img src="{{ preview | relative_url | escape }}" width="2000" height="1500" alt="{{ evidence.title | escape }}, page {{ forloop.index }} of {{ forloop.length }}" loading="lazy"></a><figcaption>{{ evidence.title | escape }} · {{ forloop.index }} / {{ forloop.length }}</figcaption></figure>
{% endfor %}
{% else %}
<object type="application/pdf" data="{{ evidence.pdf | relative_url | escape }}" aria-label="{{ evidence.title | escape }}" title="{{ evidence.title | escape }}">
<p><a href="{{ evidence.pdf | relative_url | escape }}" download>Download PDF</a></p>
</object>
{% endif %}
</div>
{% endif %}
</aside>
