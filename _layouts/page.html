---
layout: default
---
<article class="post"><div class="post-copy"><h1>{{ page.title | escape }}</h1>
{% if page.published_at %}{% include post-time.html entry=page %}{% endif %}
{% include quote.html entry=page %}
<div class="post-body">{{ content }}</div>
</div>
{% include media-pane.html entry=page %}
</article>

{% if page.url contains '/archive/' %}
<link rel="stylesheet" href="{{ '/assets/archive-media-modal.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script src="{{ '/assets/archive-media-modal.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{% endif %}
